# 应用名称，用于标识当前服务，也会显示在启动日志中
spring.application.name=spring-ai-agent-demo1

# 从运行环境读取 API Key；在 IDEA 运行配置中设置 DASHSCOPE_API_KEY，不要在此填写真实密钥
spring.ai.openai.api-key=${DASHSCOPE_API_KEY}

# 阿里云百炼北京地域的 OpenAI 兼容接口地址，需与 API Key 所属服务匹配
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1

# 本次请求使用的模型名称；API Key 用于身份认证，模型由此配置指定
spring.ai.openai.chat.model=qwen3.7-flash

# 将 SimpleLoggerAdvisor 的日志级别设为 DEBUG，便于查看对话请求与响应
# 需要在 ChatClient 中注册 SimpleLoggerAdvisor 才会输出对应日志；日志可能包含对话和工具数据
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG
